# ============================================================
# 昆仑创作引擎 — K8s Secret（模板文件）
#
# ⚠️ 使用前必须替换所有 <PLACEHOLDER> 为真实密钥！
#    此文件不应提交到 Git 仓库，生产环境建议使用
#    External Secrets Operator 或 Vault 管理敏感信息。
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: kunlun-secret
  namespace: kunlun
  labels:
    app: kunlun
type: Opaque
stringData:
  # --- Neo4j 认证 ---
  # 用途: 连接 Neo4j 图数据库的用户名和密码
  NEO4J_USER: "<your-neo4j-username>"
  NEO4J_PASSWORD: "<your-neo4j-password>"

  # --- OpenAI API 密钥 ---
  # 用途: GachaEngine 调用 GPT-4o 等模型进行蓝图生成和内容写作
  OPENAI_API_KEY: "<your-openai-api-key>"

  # --- Anthropic API 密钥 ---
  # 用途: GachaEngine tier1 模型池，调用 Claude 系列模型
  ANTHROPIC_API_KEY: "<your-anthropic-api-key>"

  # --- DeepSeek API 密钥 ---
  # 用途: GachaEngine tier1/tier2 模型池，调用 DeepSeek-V3/R1
  DEEPSEEK_API_KEY: "<your-deepseek-api-key>"
