# ============================================================
# 昆仑创作引擎 — K8s Service
# 提供 ClusterIP（集群内访问）和 LoadBalancer（外部访问）双模式
# ============================================================
---
# 模式一: ClusterIP — 集群内部访问（默认启用）
apiVersion: v1
kind: Service
metadata:
  name: kunlun-service
  namespace: kunlun
  labels:
    app: kunlun
spec:
  type: ClusterIP
  selector:
    app: kunlun
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP

---
# 模式二: LoadBalancer — 外部访问（取消注释以启用）
