[package]
name = "kunlun-engine"
version = "1.0.0"
description = "昆仑创作引擎 · 万山之主"
authors = ["Kunlun Team"]
edition = "2021"

[lib]
name = "kunlun_engine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
